name: Build and push SatuSky Harbor images

# The platform runs Convex from registry.satusky.com, never from a third-party
# registry. Convex's own release workflows publish to ghcr.io/get-convex, which
# is not under our control -- when those packages went private, seven dashboards
# kept running only from node image caches with no recoverable source.

on:
  push:
    branches: [main]
    tags: ["satusky-*"]
  pull_request:
    paths:
      - "self-hosted/docker-build/**"
      - ".github/workflows/satusky-harbor-images.yml"
  workflow_dispatch:

concurrency:
  group: harbor-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Depot exchanges a GitHub OIDC token for a short-lived build token.
  id-token: write

jobs:
  build:
    name: ${{ matrix.component }}
    # Self-hosted runners carry the disk a Rust build needs. The label comes from
    # the org variable SELF_HOSTED_RUNNER_LABEL so it cannot drift from whatever
    # the runner group actually advertises -- asking for a label nobody carries
    # queues forever instead of failing.
    runs-on: ${{ vars.SELF_HOSTED_RUNNER_LABEL || matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: self-hosted/docker-build/Dockerfile.backend
            repository: satusky-convex
            runner: satusky-org-runners
          - component: dashboard
            dockerfile: self-hosted/docker-build/Dockerfile.dashboard
            repository: satusky-convex-dashboard
            runner: satusky-org-runners
    steps:
      - uses: actions/checkout@v4

      # The backend is a large Rust build; hosted runners start with little
      # free space and will fail mid-compile without this.
      - name: Free disk space
        if: matrix.component == 'backend'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Log in to Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: registry.satusky.com
          username: ${{ secrets.SATUSKY_REGISTRY_USER_USERNAME }}
          password: ${{ secrets.SATUSKY_REGISTRY_PASSWORD }}

      # The self-hosted runner is unprivileged, so the default docker-container
      # driver cannot start a builder ("failed to initialize builder"). The
      # docker driver builds through the daemon instead.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      # Depot is used when its token is configured (faster, cached layers);
      # otherwise build locally so this workflow never blocks on external setup.
      - name: Build ${{ matrix.component }} (Depot)
        if: ${{ env.DEPOT_TOKEN != '' }}
        env:
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
        uses: depot/build-push-action@v1
        with:
          project: ${{ secrets.DEPOT_PROJECT_ID }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            registry.satusky.com/satusky-marketplace/${{ matrix.repository }}:${{ github.sha }}
            registry.satusky.com/satusky-marketplace/${{ matrix.repository }}:${{ github.ref_name }}

      - name: Build ${{ matrix.component }} (local)
        if: ${{ env.DEPOT_TOKEN == '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            registry.satusky.com/satusky-marketplace/${{ matrix.repository }}:${{ github.sha }}
            registry.satusky.com/satusky-marketplace/${{ matrix.repository }}:${{ github.ref_name }}
