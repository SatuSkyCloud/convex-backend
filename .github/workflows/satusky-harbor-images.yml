name: Build and push SatuSky Harbor images

# The platform runs Convex from registry.satusky.com, never from a third-party
# registry. Convex's own release workflows publish to ghcr.io/get-convex, which
# is not under our control -- when those packages went private, seven dashboards
# kept running only from node image caches with no recoverable source.

on:
  push:
    branches: [main]
    tags: ["satusky-*"]
  pull_request:
    paths:
      - "self-hosted/docker-build/**"
      - ".github/workflows/satusky-harbor-images.yml"
  workflow_dispatch:

concurrency:
  group: harbor-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.component }}
    # Depot builds run on Depot's own workers. The runner only drives the CLI, so
    # it needs no Docker daemon -- which is why this does not use the privileged
    # pool and does not need the disk a local Rust build would.
    runs-on: ${{ vars.SELF_HOSTED_RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: self-hosted/docker-build/Dockerfile.backend
            repository: satusky-convex
          - component: dashboard
            dockerfile: self-hosted/docker-build/Dockerfile.dashboard
            repository: satusky-convex-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: registry.satusky.com
          username: ${{ secrets.SATUSKY_REGISTRY_USER_USERNAME }}
          password: ${{ secrets.SATUSKY_REGISTRY_PASSWORD }}

      - name: Build ${{ matrix.component }}
        uses: depot/build-push-action@v1
        env:
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
        with:
          project: ${{ secrets.DEPOT_PROJECT_ID }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            registry.satusky.com/satusky-marketplace/${{ matrix.repository }}:${{ github.sha }}
            registry.satusky.com/satusky-marketplace/${{ matrix.repository }}:${{ github.ref_name }}
