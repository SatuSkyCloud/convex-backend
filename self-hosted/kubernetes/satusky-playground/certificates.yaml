# These Certificate resources re-establish cert-manager ownership of the three
# TLS secrets referenced by the satusky-gateway-direct HTTPS listeners:
#   - convex-test-101-api-tls       (api-convex-test-101.satusky.com)
#   - convex-test-101-site-tls      (convex-test-101.satusky.com)
#   - convex-test-101-dashboard-tls (dashboard-convex-test-101.satusky.com)
#
# During the ingress-nginx -> kgateway migration the Ingresses (and their
# ingress-shim Certificate resources) were removed, leaving the secrets
# orphaned. cert-manager must own these Certificate resources so the certs are
# issued and renewed before they expire.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: convex-test-101-api-tls
  namespace: playground
  labels:
    app.kubernetes.io/name: convex
    app.kubernetes.io/instance: convex-test-101
    app.kubernetes.io/component: backend
spec:
  secretName: convex-test-101-api-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - api-convex-test-101.satusky.com
  issuerRef:
    name: convex-test-101-letsencrypt-nginx
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: convex-test-101-site-tls
  namespace: playground
  labels:
    app.kubernetes.io/name: convex
    app.kubernetes.io/instance: convex-test-101
    app.kubernetes.io/component: backend
spec:
  secretName: convex-test-101-site-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - convex-test-101.satusky.com
  issuerRef:
    name: convex-test-101-letsencrypt-nginx
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: convex-test-101-dashboard-tls
  namespace: playground
  labels:
    app.kubernetes.io/name: convex
    app.kubernetes.io/instance: convex-test-101
    app.kubernetes.io/component: dashboard
spec:
  secretName: convex-test-101-dashboard-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - dashboard-convex-test-101.satusky.com
  issuerRef:
    name: convex-test-101-letsencrypt-nginx
    kind: Issuer
    group: cert-manager.io
